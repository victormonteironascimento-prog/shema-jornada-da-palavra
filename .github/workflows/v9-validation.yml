name: V9 validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r tests/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/validate_v9.py
      - run: python tests/validate_config.py
      - run: python tests/validate_pwa.py
